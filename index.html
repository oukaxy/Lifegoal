<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>LifeGoal — Papan Pencapaian Hidup</title>
  <meta name="description" content="Papan pencapaian hidupmu, dirimu yang tentukan. Buat quest, kejar, dan tandai selesai.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <div class="app">

    <!-- ============ TOP BAR ============ -->
    <header class="topbar">
      <p class="brand">LIFE<b>GOAL</b></p>
      <button class="icon-btn" id="addBtn" type="button" aria-label="Buat pencapaian baru" title="Buat pencapaian baru"></button>
    </header>

    <!-- ============ KARTU PEMAIN ============ -->
    <section class="player" aria-label="Kartu pemain">
      <div class="player-top">
        <div class="xp-ring" id="xpRing">
          <svg viewBox="0 0 88 88" width="88" height="88" aria-hidden="true">
            <circle class="ring-track" cx="44" cy="44" r="36"/>
            <circle class="ring-fill" id="ringFill" cx="44" cy="44" r="36"/>
          </svg>
          <div class="ring-label"><b id="levelNum">1</b><span>LEVEL</span></div>
        </div>
        <div class="player-id">
          <p class="player-name" id="playerName" contenteditable="true" spellcheck="false" title="Klik untuk mengubah nama">Petualang</p>
          <p class="player-title" id="levelTitle">Pemula</p>
        </div>
      </div>
      <div class="xp-line">
        <div class="xp-bar"><i id="xpFill"></i></div>
        <p class="xp-numbers" id="xpNumbers">0 XP</p>
      </div>
      <div class="player-stats" id="statRow"></div>
    </section>

    <!-- ============ FILTER ============ -->
    <div class="filters" id="filters" hidden>
      <div class="chip-row" id="catFilters" role="tablist" aria-label="Filter kategori"></div>
      <div class="chip-row" id="rarityFilters" role="tablist" aria-label="Filter rarity"></div>
    </div>

    <!-- ============ PAPAN ============ -->
    <main>
      <div class="board-meta">
        <h2>Papan Pencapaian</h2>
        <p id="boardCount"></p>
      </div>
      <div class="grid" id="grid"></div>
    </main>

    <footer class="foot">
      <p>Kamu yang tentukan questmu — kejar satu per satu.</p>
      <button class="link-btn" id="resetBtn" type="button">Reset tanda selesai</button>
    </footer>

  </div>

  <!-- ============ MODAL ============ -->
  <div class="backdrop" id="backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ============ TOAST ============ -->
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <!-- ============ LEVEL UP ============ -->
  <div class="levelup" id="levelUp" hidden></div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/icons.js?v=3"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/state.js?v=3"></script>
  <script src="js/animations.js?v=3"></script>
  <script src="js/render.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
